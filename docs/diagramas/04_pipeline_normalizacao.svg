<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="695px" preserveAspectRatio="none" style="width:548px;height:695px;background:#FFFFFF;" version="1.1" viewBox="0 0 548 695" width="548px" zoomAndPan="magnify"><title>Pipeline de normaliza&#231;&#227;o &#8212; uma passada, caractere a caractere</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="505.0117" x="20" y="32.9951">Pipeline de normaliza&#231;&#227;o &#8212; uma passada, caractere a caractere</text></g><ellipse cx="260.5059" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#EDF2F7" height="35.1328" rx="5" ry="5" style="stroke:#4A5568;stroke-width:0.5;" width="123.9365" x="198.5376" y="87.2969"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="103.9365" x="208.5376" y="109.3638">Mensagem crua</text><rect fill="#EDF2F7" height="65.3984" rx="5" ry="5" style="stroke:#4A5568;stroke-width:0.5;" width="346.8345" x="87.0886" y="197.5625"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.0981" x="97.0886" y="219.6294">&#167;2 Unicode</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="286.127" x="97.0886" y="234.7622">NFKD &#8594; descarta acentos (Mn) &#8594; min&#250;scula</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="326.8345" x="97.0886" y="249.895">&#8594; classifica: letra/d&#237;gito, delimitador ou separador</text><rect fill="#EDF2F7" height="65.3984" rx="5" ry="5" style="stroke:#4A5568;stroke-width:0.5;" width="237.5469" x="141.7324" y="282.9609"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="217.5469" x="151.7324" y="305.0278">&#167;3 Letras repetidas e espa&#231;os</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="156.4888" x="151.7324" y="320.1606">3+ letras iguais viram 1</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="216.1504" x="151.7324" y="335.2935">separadores viram um s&#243; espa&#231;o</text><rect fill="#EDF2F7" height="65.3984" rx="5" ry="5" style="stroke:#4A5568;stroke-width:0.5;" width="285.4209" x="117.7954" y="383.3594"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="245.5464" x="127.7954" y="405.4263">&#167;4 Janela de g&#237;rias (Aho-Corasick)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="246.4033" x="127.7954" y="420.5591">avan&#231;a o aut&#244;mato; ao sair da janela,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="265.4209" x="127.7954" y="435.6919">troca a ocorr&#234;ncia mais longa por inteiro</text><rect fill="#EDF2F7" height="50.2656" rx="5" ry="5" style="stroke:#4A5568;stroke-width:0.5;" width="306.8252" x="107.0933" y="468.7578"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.897" x="117.0933" y="490.8247">&#167;5 Frases e tokens</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="286.8252" x="117.0933" y="505.9575">espa&#231;o fecha token; delimitador fecha frase</text><rect fill="#EDF2F7" height="35.1328" rx="5" ry="5" style="stroke:#4A5568;stroke-width:0.5;" width="139.2026" x="190.9045" y="142.4297"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="119.2026" x="200.9045" y="164.4966">Pr&#